[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sptg-geospatial"
version = "0.1.0"
description = "SPTG Library"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Malvern Yap" }
]
dependencies = [
    "geographiclib",
    "geopandas",
    "shapely"
]

[project.optional-dependencies]
dev = [
    "black",
    "isort",
    "pytest",
    "ruff"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 200

[tool.ruff]
line-length = 200
